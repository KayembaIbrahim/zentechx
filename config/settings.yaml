# ============================================================
#  MT5 Trading Bot — Master Configuration
#  Edit this file with your MT5 credentials and preferences.
# ============================================================

# ── MetaTrader 5 Connection ─────────────────────────────────
mt5:
  login: 0              # Your MT5 account number (integer)
  password: ""          # Your MT5 password
  server: ""            # Broker server (e.g. "ICMarkets-Demo")
  path: ""              # Optional: MT5 install path if non-standard
  timeout: 60000        # Connection timeout (ms)

# ── Trading Instruments ─────────────────────────────────────
trading:
  symbols:
    - "EURUSD"
    - "GBPUSD"
    - "USDJPY"
    - "XAUUSD"
  max_spread: 30        # Max spread in points (0 = no limit)
  magic_number: 20240609
  comment: "AIVortex"

# ── Risk Management ─────────────────────────────────────────
risk:
  max_daily_loss_pct: 8.0          # % of account — stops bot for the day
  max_drawdown_pct: 20.0           # % from peak equity
  max_positions_total: 3           # max concurrent positions
  max_positions_per_symbol: 1
  risk_per_trade_pct: 2.5          # % of account risked per trade
  stop_loss_pct: 0.8               # % from entry
  take_profit_pct: 2.0             # % from entry
  use_trailing_stop: true
  trailing_activation_pct: 0.5     # profit % to activate trailing
  trailing_distance_pct: 0.2       # trailing stop distance %
  min_account_balance: 5.0         # minimum balance to trade
  target_account_balance: 1000.0   # goal

# ── Strategies ──────────────────────────────────────────────
# The bot AUTOMATICALLY selects the best strategy per market condition.
strategies:
  candy:
    enabled: true
    weight: 1.0
    timeframe: "M1"
    params:
      fast_ema: 5
      slow_ema: 20
      rsi_period: 14
      rsi_overbought: 70
      rsi_oversold: 30
      atr_multiplier: 1.5
      min_volume: 0.01

  scalping:
    enabled: true
    weight: 1.0
    timeframe: "M1"
    params:
      fast_ma: 9
      slow_ma: 21
      rsi_period: 7
      rsi_overbought: 75
      rsi_oversold: 25
      min_profit_pips: 5
      max_hold_bars: 10
      min_volume: 0.01

  trend:
    enabled: true
    weight: 1.0
    timeframe: "M5"
    params:
      trend_ema: 200
      entry_ema: 50
      adx_period: 14
      adx_threshold: 25
      atr_multiplier: 2.0
      min_volume: 0.01

  mean_reversion:
    enabled: true
    weight: 0.5
    timeframe: "M5"
    params:
      bb_period: 20
      bb_std: 2.0
      rsi_period: 14
      rsi_overbought: 75
      rsi_oversold: 25
      atr_multiplier: 1.0
      min_volume: 0.01

  breakout:
    enabled: true
    weight: 0.7
    timeframe: "M5"
    params:
      lookback: 20
      breakout_multiplier: 0.5
      volume_threshold: 1.5
      atr_multiplier: 2.0
      min_volume: 0.01

# ── Notifications ───────────────────────────────────────────
notifications:
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
  console: true

# ── General ─────────────────────────────────────────────────
general:
  mode: "demo"              # "demo" | "live"
  check_interval: 10        # seconds between trade checks
  log_level: "INFO"         # DEBUG | INFO | WARNING | ERROR
  close_positions_on_stop: false
